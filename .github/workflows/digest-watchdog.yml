# Emails the owner when the profile digest stops updating.
#
# Why this is a separate workflow: the gather and publish workflows can stall without
# ever failing (a run stuck waiting, runs cancelled behind it), and GitHub only sends
# email for failed runs. This one has its own schedule, its own concurrency group and
# no environment, so nothing the digest pipeline does can hold it up. A red run here
# is the email.

name: 'Digest: watchdog'

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Fail if the published digest is stale
        run: |
          generated=$(node -e "console.log(JSON.parse(require('fs').readFileSync('digest.json','utf8')).generated ?? '')")
          if [ -z "$generated" ]; then
            echo "No digest published yet -- nothing to watch."
            exit 0
          fi
          # `generated` is a date, so the age can read up to 24 hours high; 60 hours
          # means "missed at least two daily digests".
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$generated" +%s) ) / 3600 ))
          if [ "$age_hours" -gt 60 ]; then
            echo "::error title=Digest stale::The profile digest was last published $generated ($age_hours hours ago). Check the Actions tab for stuck or cancelled runs of 'Digest: gather payload' and 'Digest: gate and publish', and that the cloud routine at https://claude.ai/code/routines is running."
            exit 1
          fi
          echo "Last digest from $generated, $age_hours hours ago -- within budget."
