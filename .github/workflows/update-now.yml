# Rewrites the "What I'm working on" block in README.md as a five-day digest.
# See SETUP.md at the repo root for the token setup -- there are three secrets,
# and the two GitHub ones are deliberately different from each other.

name: Update "now" section

on:
  schedule:
    # 07:15 UTC daily. Off the hour on purpose -- GitHub's scheduler is busiest
    # exactly on the hour and delays cron jobs there.
    - cron: '15 7 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'scripts/projects.json'   # re-render immediately when you edit the whitelist

permissions:
  contents: write

concurrency:
  group: update-now
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # "Not set up yet" and "broken" must not look the same. Before this, an
      # unconfigured repo failed every night -- a failure email each morning and a
      # row of red crosses on a public profile repo, for something that was never
      # wrong. Unconfigured now skips with a notice; configured-and-failing still
      # fails loudly, which is the case worth an email.
      CONFIGURED: ${{ secrets.PROFILE_READ_TOKEN != '' && secrets.PROFILE_DIGEST_TOKEN != '' && secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # Checkout and install run either way, so a green skip still proves the
      # toolchain works rather than proving nothing.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Not configured yet
        if: env.CONFIGURED != 'true'
        run: >-
          echo "::notice title=Digest skipped::One or more of PROFILE_READ_TOKEN,
          PROFILE_DIGEST_TOKEN, ANTHROPIC_API_KEY is not set. See SETUP.md.
          The README keeps its current content."

      - name: Regenerate the block
        if: env.CONFIGURED == 'true'
        env:
          # Metadata: Read-only, ALL repositories. Decides what exists and when it
          # was pushed. Cannot read a line of code.
          GH_META_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          # Contents: Read-only, scoped to ONLY the repos in scripts/projects.json.
          # This is what makes the whitelist enforceable at the credential rather
          # than in JavaScript: an unlisted repo is unreadable, not merely skipped.
          GH_DIGEST_TOKEN: ${{ secrets.PROFILE_DIGEST_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. A channel-scoped webhook URL, not an account credential.
          # Unset, the Discord step no-ops -- safe to ship before the server exists.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_USER: ${{ github.repository_owner }}
          DIGEST_MODEL: claude-haiku-4-5
          DIGEST_DAYS: '5'
        run: node scripts/build-digest.mjs

      - name: Commit if anything changed
        if: env.CONFIGURED == 'true'
        run: |
          # Keyed on README only, deliberately. digest.json carries a generated-on
          # date that moves every night, so checking it too would commit daily
          # whether or not anything actually happened.
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md digest.json
          git commit -m "chore: refresh now section"
          git push
