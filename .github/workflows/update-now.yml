# DRAFT — goes at .github/workflows/update-now.yml in the msantoro12/msantoro12 repo.
#
# Rewrites the "What I'm working on" block in README.md from real push activity.
# See README-SETUP.md in this folder for the token setup.

name: Update "now" section

on:
  schedule:
    # 07:15 UTC daily. Off the hour on purpose -- GitHub's scheduler is busiest
    # exactly on the hour and delays cron jobs there.
    - cron: '15 7 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'scripts/projects.json'   # re-render immediately when you edit the whitelist

permissions:
  contents: write

concurrency:
  group: update-now
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the block
        env:
          # Fine-grained PAT. Read-only "Metadata" on all repositories is enough --
          # it must NOT have contents/code access. The default GITHUB_TOKEN cannot
          # see your other repositories, which is why this exists.
          GH_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          MAX_ITEMS: '4'
        run: node scripts/build-now.mjs

      - name: Commit if anything changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "chore: refresh now section"
          git push
